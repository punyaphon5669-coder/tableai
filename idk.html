<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teachable Machine Image Classifier</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 15px;
            margin: 0;
        }
        .container {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 450px;
            width: 100%;
            text-align: center;
        }
        h2 {
            margin-top: 0;
            color: #2c3e50;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        button, .upload-label {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 18px;
            font-size: 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            display: inline-block;
        }
        button:hover, .upload-label:hover {
            background-color: #2980b9;
        }
        button.capture-btn {
            background-color: #2ecc71;
        }
        button.capture-btn:hover {
            background-color: #27ae60;
        }
        input[type="file"] {
            display: none;
        }
        #display-area {
            margin: 15px auto;
            width: 250px;
            height: 250px;
            border: 2px dashed #bdc3c7;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background-color: #fafafa;
            position: relative;
        }
        #display-area img, #display-area canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #status {
            font-size: 14px;
            color: #7f8c8d;
            margin-bottom: 10px;
        }
        #label-container {
            margin-top: 20px;
            text-align: left;
        }
        .result-bar {
            margin-bottom: 10px;
        }
        .result-text {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 4px;
        }
        .progress-bg {
            background-color: #ecf0f1;
            border-radius: 6px;
            height: 12px;
            overflow: hidden;
        }
        .progress-fill {
            background-color: #3498db;
            height: 100%;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>ระบบจำแนกรูปภาพ AI</h2>
    <div id="status">กำลังโหลดโมเดล...</div>

    <div class="btn-group">
        <!-- ปุ่มอัปโหลดรูป -->
        <label for="image-upload" class="upload-label">📁 อัปโหลดรูปภาพ</label>
        <input type="file" id="image-upload" accept="image/*" onchange="handleImageUpload(event)">

        <!-- ปุ่มเปิดกล้อง -->
        <button type="button" id="camera-btn" onclick="startCamera()">📷 เปิดกล้อง</button>
    </div>

    <!-- ปุ่มกดถ่ายรูป (จะแสดงเมื่อเปิดกล้อง) -->
    <div id="capture-controls" style="display: none; margin-bottom: 15px;">
        <button type="button" class="capture-btn" onclick="takeSnapshot()">📸 กดถ่ายรูปเพื่อทำนายผล</button>
    </div>

    <!-- พื้นที่แสดงภาพหรือกล้อง -->
    <div id="display-area">
        <span style="color: #95a5a6; font-size: 14px;">เลือกรูปภาพ หรือ เปิดกล้อง</span>
    </div>

    <!-- พื้นที่แสดงผลลัพธ์ -->
    <div id="label-container"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

<script type="text/javascript">
    // ลิงก์ไปยังโฟลเดอร์โมเดลของคุณ (หรือเปลี่ยนเป็น URL ที่ได้จาก Teachable Machine)
    const URL = "./my_model/";

    let model, webcam, labelContainer, maxPredictions;
    let isWebcamRunning = false;
    let animationId;

    // 1. โหลดโมเดลทันทีที่เปิดหน้าเว็บ
    window.onload = async function() {
        const statusEl = document.getElementById("status");
        try {
            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";
            model = await tmImage.load(modelURL, metadataURL);
            maxPredictions = model.getTotalClasses();
            statusEl.innerText = "พร้อมใช้งาน! กรุณาอัปโหลดรูปหรือเปิดกล้อง";
            statusEl.style.color = "#27ae60";
            setupLabelContainer();
        } catch (error) {
            statusEl.innerText = "โหลดโมเดลไม่สำเร็จ กรุณาตรวจสอบโฟลเดอร์ ./my_model/";
            statusEl.style.color = "#e74c3c";
            console.error(error);
        }
    };

    // สร้างแถบแสดงผลลัพธ์ตามจำนวน Class
    function setupLabelContainer() {
        labelContainer = document.getElementById("label-container");
        labelContainer.innerHTML = "";
        for (let i = 0; i < maxPredictions; i++) {
            const div = document.createElement("div");
            div.className = "result-bar";
            div.innerHTML = `
                <div class="result-text">
                    <span class="class-name">-</span>
                    <span class="class-prob">0%</span>
                </div>
                <div class="progress-bg">
                    <div class="progress-fill" style="width: 0%;"></div>
                </div>
            `;
            labelContainer.appendChild(div);
        }
    }

    // 2. ฟังก์ชันจัดการเมื่ออัปโหลดรูปภาพ
    function handleImageUpload(event) {
        const file = event.target.files[0];
        if (!file) return;

        stopCamera(); // ปิดกล้องหากเปิดอยู่

        const reader = new FileReader();
        reader.onload = function(e) {
            const img = document.createElement("img");
            img.src = e.target.result;
            img.onload = async function() {
                const displayArea = document.getElementById("display-area");
                displayArea.innerHTML = "";
                displayArea.appendChild(img);
                await predict(img); // ทำนายผลจากรูปที่อัปโหลด
            };
        };
        reader.readAsDataURL(file);
    }

    // 3. ฟังก์ชันเปิดกล้อง (แสดงภาพสดเพื่อเตรียมถ่ายรูป)
    async function startCamera() {
        if (isWebcamRunning) return;

        const displayArea = document.getElementById("display-area");
        displayArea.innerHTML = "<span style='color:#7f8c8d;'>กำลังเปิดกล้อง...</span>";

        const flip = true; 
        webcam = new tmImage.Webcam(250, 250, flip);
        await webcam.setup(); // ขออนุญาตใช้กล้อง
        await webcam.play();
        isWebcamRunning = true;

        displayArea.innerHTML = "";
        displayArea.appendChild(webcam.canvas);
        document.getElementById("capture-controls").style.display = "block";

        // อัปเดตภาพจากกล้องต่อเนื่อง (ยังไม่ทำนายผลจนกว่าจะกดถ่ายรูป)
        function updateWebcam() {
            if (!isWebcamRunning) return;
            webcam.update();
            animationId = window.requestAnimationFrame(updateWebcam);
        }
        updateWebcam();
    }

    // 4. ฟังก์ชันกดถ่ายรูป (Snapshot) และทำนายผล
    async function takeSnapshot() {
        if (!isWebcamRunning || !webcam) return;

        // สร้าง Canvas เพื่อเก็บภาพนิ่งที่ถ่ายได้
        const snapshotCanvas = document.createElement("canvas");
        snapshotCanvas.width = webcam.canvas.width;
        snapshotCanvas.height = webcam.canvas.height;
        const ctx = snapshotCanvas.getContext("2d");
        ctx.drawImage(webcam.canvas, 0, 0);

        // หยุดกล้องและแสดงภาพนิ่งที่เพิ่งถ่ายแทน
        stopCamera();
        const displayArea = document.getElementById("display-area");
        displayArea.innerHTML = "";
        displayArea.appendChild(snapshotCanvas);

        // นำภาพนิ่งที่ถ่ายได้ไปให้ AI ทำนายผล
        await predict(snapshotCanvas);
    }

    // ฟังก์ชันปิดกล้อง
    function stopCamera() {
        if (isWebcamRunning && webcam) {
            webcam.stop();
            isWebcamRunning = false;
            cancelAnimationFrame(animationId);
        }
        document.getElementById("capture-controls").style.display = "none";
    }

    // 5. ฟังก์ชันทำนายผล (รับค่าได้ทั้ง <img> และ <canvas>)
    async function predict(imageElement) {
        if (!model) return;
        const prediction = await model.predict(imageElement);
        
        for (let i = 0; i < maxPredictions; i++) {
            const probPercent = (prediction[i].probability * 100).toFixed(1) + "%";
            const barItem = labelContainer.childNodes[i];
            
            barItem.querySelector(".class-name").innerText = prediction[i].className;
            barItem.querySelector(".class-prob").innerText = probPercent;
            barItem.querySelector(".progress-fill").style.width = probPercent;
        }
    }
</script>

</body>
</html>
